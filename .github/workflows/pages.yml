# Publica la app en GitHub Pages cada vez que hay cambios en la rama main.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Armar la carpeta a publicar
        run: |
          mkdir _sitio
          cp -r index.html manifest.webmanifest sw.js version.js css js icons _sitio/
          # Cada publicación lleva el código del commit: los celulares la detectan como actualización.
          sed -i "s/const BUILD = 'dev';/const BUILD = '${GITHUB_SHA::7}';/" _sitio/sw.js
          grep -q "const BUILD = '${GITHUB_SHA::7}';" _sitio/sw.js
          echo "Versión $(grep -o "'[^']*'" version.js) (build ${GITHUB_SHA::7})"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
